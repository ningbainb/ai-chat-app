name: Android CI Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish APK to GitHub Release"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-${{ github.run_number }}
          name: Debug APK ${{ github.run_number }}
          body: |
            Auto-built debug APK from workflow run #${{ github.run_number }}.
          files: app/build/outputs/apk/debug/app-debug.apk
