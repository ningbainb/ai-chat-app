name: Android CI Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish APK to GitHub Release"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
  pull_request:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK (with logs)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace --info 2>&1 | tee build-debug.log

      - name: Collect APK file list
        if: success()
        id: apk_files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find app/build/outputs/apk -type f -name "*.apk" | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No APK files found."
            exit 0
          fi
          {
            echo 'paths<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact(s)
        if: success() && steps.apk_files.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.apk_files.outputs.paths }}
          if-no-files-found: error

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build-debug.log
          if-no-files-found: warn

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: warn

      - name: Publish APK to GitHub Release
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true' && steps.apk_files.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-${{ github.run_number }}
          name: Debug APK ${{ github.run_number }}
          body: |
            Auto-built debug APK from workflow run #${{ github.run_number }}.
          files: ${{ steps.apk_files.outputs.paths }}
