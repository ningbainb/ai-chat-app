name: Android CI Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish APK to GitHub Release"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push: {}
  pull_request: {}

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK (with logs)
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace --info 2>&1 | tee build-debug.log

      - name: Inspect APK output directory
        if: always()
        run: |
          echo "Listing APK outputs:"
          find app/build/outputs -maxdepth 6 -type f | sort || true

      - name: Collect APK file list
        if: success()
        id: apk_files
        run: |
          shopt -s globstar nullglob
          files=(app/build/outputs/apk/**/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "has_apk=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${files[@]}" > apk-files.txt
            echo "has_apk=true" >> "$GITHUB_OUTPUT"
            echo "apk_list_file=apk-files.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact(s)
        if: success() && steps.apk_files.outputs.has_apk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build-debug.log
          if-no-files-found: warn

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: warn

      - name: Publish APK to GitHub Release
        if: success() && github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' && steps.apk_files.outputs.has_apk == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-${{ github.run_id }}-${{ github.run_attempt }}
          name: Debug APK ${{ github.run_number }} (attempt ${{ github.run_attempt }})
          body: |
            Auto-built debug APK from workflow run #${{ github.run_number }} (attempt ${{ github.run_attempt }}).
          files: app/build/outputs/apk/**/*.apk
